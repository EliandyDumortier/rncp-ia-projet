# ============================================================
# Pipeline CI/CD — Application web React de recommandation de K-Dramas
# Fichier : .github/workflows/ci_cd_app.yml
#
# Étape 4 — C19 (Chaîne de livraison continue)
#
# Étapes du pipeline :
#   1. LINT   — eslint (vérification du style et de la qualité)
#   2. TEST   — vitest avec couverture (≥ 80 %)
#   3. BUILD  — Construction de l'image Docker + push vers le registre
#   4. DEPLOY — Déploiement sur staging (develop) ou production (main)
#
# Auteur : Équipe projet RNCP AI
# ============================================================

name: CI/CD — Application Web React K-Drama IA

on:
  push:
    branches: [etape4/integration-app, develop, main]
    paths:
      - '.github/workflows/ci_cd_app.yml'
      - 'dossier_projet/etape4/**'
  pull_request:
    branches: [develop, main]
    paths:
      - '.github/workflows/ci_cd_app.yml'
      - 'dossier_projet/etape4/**'

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: '22'
  WORKING_DIR: dossier_projet/etape4

jobs:
  # ============================================================
  # Étape 1 : LINT — Vérification du style et de la qualité du code
  # ============================================================
  lint:
    name: Lint (eslint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '${{ env.WORKING_DIR }}/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run eslint
        run: npm run lint

      - name: Lint report
        if: always()
        run: |
          echo "## Lint Report" >> $GITHUB_STEP_SUMMARY
          echo "eslint verified the code." >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # Étape 2 : TEST — Tests automatisés avec couverture
  # ============================================================
  test:
    name: Tests (vitest + coverage)
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '${{ env.WORKING_DIR }}/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        env:
          # Unit tests must not depend on a developer's local data API.
          # The application then exercises its documented local-catalog fallback.
          VITE_API_DATA_URL: http://127.0.0.1:9
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ env.WORKING_DIR }}/coverage/
          retention-days: 30

      - name: Test summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "All tests executed with Vitest; configured coverage thresholds are enforced." >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # Étape 3 : BUILD — Construction de l'image Docker
  # ============================================================
  build:
    name: Build (Docker image)
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/kdrama-app
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.WORKING_DIR }}
          file: ${{ env.WORKING_DIR }}/docker/Dockerfile.app
          # Pull requests validate the image build without publishing it.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build summary
        if: always()
        run: |
          echo "## Docker Build" >> $GITHUB_STEP_SUMMARY
          echo "Image build completed; branch pushes are published to ghcr.io." >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # Étape 4a : DEPLOY Staging (push vers develop)
  # ============================================================
  deploy-staging:
    name: Deploy (Staging)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.kdrama-ia.example.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to staging
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          echo "Deploying image ghcr.io/${{ github.repository }}/kdrama-app:staging to staging..."
          echo "## Staging Deployment" >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # Étape 4b : DEPLOY Production (push vers main uniquement)
  # ============================================================
  deploy-production:
    name: Deploy (Production)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://kdrama-ia.example.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to production
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          echo "Deploying image ghcr.io/${{ github.repository }}/kdrama-app:latest to production..."
          echo "## Production Deployment" >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # Job de notification (résumé global)
  # ============================================================
  notify:
    name: Notification
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: always()

    steps:
      - name: Pipeline summary
        run: |
          echo "## CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint  | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test  | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
